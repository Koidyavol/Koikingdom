name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install required packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -s "$GITHUB_WORKSPACE/debug.keystore"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

      - name: Import project and install Android build template
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --editor --path . --quit
          godot --headless --editor --path . --install-android-build-template --quit
          test -f android/build.gradle
          test -f android/settings.gradle
          echo "Godot Android Gradle build template installed."

      - name: Export and validate APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug Android build/KoiKingdom.apk
          test -s build/KoiKingdom.apk
          file build/KoiKingdom.apk
          unzip -t build/KoiKingdom.apk
          unzip -l build/KoiKingdom.apk | grep -q "AndroidManifest.xml"
          echo "APK export and archive validation passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoiKingdom-Android-APK
          path: build/KoiKingdom.apk
          if-no-files-found: error
          retention-days: 14
