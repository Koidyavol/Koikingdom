name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -f "$GITHUB_WORKSPACE/debug.keystore"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          echo "Java: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"
          echo "Godot Android export template: present"

      - name: Import project and export APK
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug Android build/KoiKingdom.apk
          test -s build/KoiKingdom.apk
          file build/KoiKingdom.apk
          unzip -t build/KoiKingdom.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoiKingdom-Android-APK
          path: build/KoiKingdom.apk
          if-no-files-found: error
          retention-days: 14
