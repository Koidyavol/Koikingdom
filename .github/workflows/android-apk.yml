name: Build Koi Kingdom Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    container:
      # Verified published tag for the project's Godot 4.3 version.
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"

          # The image stores editor settings and export templates under /root.
          # Copy them into the runner HOME when GitHub uses a different HOME.
          if [ "$HOME" != "/root" ]; then
            if [ -d /root/.config/godot ]; then
              cp -a /root/.config/godot "$HOME/.config/"
            fi
            if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
              cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
            fi
          fi

          test -d "$HOME/.local/share/godot/export_templates/4.3.stable"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          # Godot 4.3 defaults to Android Target SDK 34. The image only had
          # Build Tools 33.0.2, which makes the Android export preset invalid.
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -u+x -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK Manager was not found under $ANDROID_HOME."
            exit 1
          fi

          # Accept SDK licenses and install the exact SDK/build-tools required
          # by Godot 4.3 instead of relying on whatever the Docker image ships.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "Installed Android SDK platforms:"
          ls -1 "$ANDROID_HOME/platforms"
          echo "Installed Android Build Tools:"
          ls -1 "$ANDROID_HOME/build-tools"

          godot --version
          java -version

      - name: Verify Godot project import
        shell: bash
        run: godot --headless --editor --path . --quit

      - name: Verify project startup
        shell: bash
        run: godot --headless --path . --quit-after 3

      - name: Prepare temporary debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          keytool -genkeypair -v \
            -keystore "$PWD/build/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Koi Kingdom Debug,O=Koidyavol,C=ID"

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/KoiKingdom.apk
          test -s build/KoiKingdom.apk
          file build/KoiKingdom.apk
          sha256sum build/KoiKingdom.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Koi-Kingdom-Android-APK
          path: build/KoiKingdom.apk
          if-no-files-found: error
          retention-days: 14
