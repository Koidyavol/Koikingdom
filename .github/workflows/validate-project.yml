name: Validate Koi Kingdom Godot Project

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run project startup check
        run: godot --headless --path . --quit-after 3

      - name: Upload project source
        uses: actions/upload-artifact@v4
        with:
          name: koi-kingdom-godot-source
          path: |
            project.godot
            scenes/
            scripts/
            README.md
